name: Build Android APK

# Builds the installable Android app (Capacitor shell around the Vite bundle)
# and publishes app-debug.apk as a downloadable artifact. Debug builds are
# signed with the throw-away keystore Gradle generates on the runner, so they
# install straight onto a phone; add a release keystore before using the APK on
# Google Play.
#
# The backend URL baked into the APK resolves in this order:
#   1. the `backend_url` input of a manual run,
#   2. the repository variable VITE_SOCKET_URL (Settings → Secrets and variables
#      → Actions → Variables),
#   3. the default below.
# Inside the app it can still be changed at runtime in Settings → Data & Storage
# → Server URL, or with a ?backend=https://… query.
on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Socket.IO backend URL baked into this build'
        required: false
        default: 'https://tonni.rmfbd.online'
      publish_release:
        description: 'Attach the APK to a GitHub release as well'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BACKEND_URL: https://tonni.rmfbd.online
  # Keep in sync with android/variables.gradle (compileSdkVersion).
  ANDROID_PLATFORM: android-36

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android platform and build tools
        run: |
          sdkmanager --install "platforms;${ANDROID_PLATFORM}" "build-tools;36.0.0" "platform-tools"
          sdkmanager --licenses > /dev/null || true

      - name: Install web dependencies
        run: npm ci

      - name: Run the web test suite
        run: npm test

      - name: Build the web bundle
        env:
          VITE_SOCKET_URL: ${{ github.event.inputs.backend_url || vars.VITE_SOCKET_URL || 'https://tonni.rmfbd.online' }}
        run: npm run build

      - name: Generate Android icons and splash screens
        run: npm run android:assets

      - name: Sync the Capacitor Android project
        run: npx cap sync android

      - name: Build the debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME="Tonni-${VERSION}-debug.apk"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/${NAME}"
          SIZE=$(du -h "artifacts/${NAME}" | cut -f1)
          SHA=$(sha256sum "artifacts/${NAME}" | cut -d' ' -f1)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${{ github.event.inputs.backend_url || vars.VITE_SOCKET_URL || env.DEFAULT_BACKEND_URL }}" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: tonni-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Write the run summary
        run: |
          {
            echo "## Tonni Android APK"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| File | \`${{ steps.collect.outputs.name }}\` |"
            echo "| Version | ${{ steps.collect.outputs.version }} |"
            echo "| Size | ${{ steps.collect.outputs.size }} |"
            echo "| Backend | \`${{ steps.collect.outputs.backend }}\` |"
            echo "| SHA-256 | \`${{ steps.collect.outputs.sha256 }}\` |"
            echo ""
            echo "### Install on an Android phone"
            echo "1. Download \`tonni-debug-apk\` from the **Artifacts** section of this run."
            echo "2. Unzip it and copy the APK to the phone."
            echo "3. Open the file and allow *Install unknown apps* for the app you used to open it."
            echo "4. Launch **Tonni**, then open Settings → Data & Storage to change the server URL if needed."
            echo ""
            echo "The APK is signed with the debug keystore, so keep it out of Google Play."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release with APK
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: tonni-debug-apk
          path: apk

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APK=$(ls apk/*.apk | head -n 1)

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="apk-${GITHUB_RUN_NUMBER}"
          fi

          NOTES=$(mktemp)
          {
            echo "Installable Android build of **Tonni (You and Me)** ${VERSION}."
            echo ""
            echo "Download \`$(basename "${APK}")\` below and open it on your phone."
            echo ""
            echo "- Signed with the debug keystore — for testing and sideloading, not for Google Play."
            echo "- Built from ${GITHUB_SHA}."
            echo "- Change the server URL in Settings → Data & Storage → Server URL."
          } > "${NOTES}"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" --clobber
          else
            gh release create "${TAG}" "${APK}" \
              --target "${GITHUB_SHA}" \
              --title "Tonni ${VERSION} (Android APK)" \
              --notes-file "${NOTES}" \
              --prerelease
          fi
